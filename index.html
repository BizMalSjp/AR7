<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR7 — うさぎとハロウィン</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none; /* ブラウザ標準のスクロールや引っ張りリフレッシュを禁止 */
    }
    /* 1本指の動作切り替えボタン */
    #mode-btn {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      padding: 8px 14px;
      font-size: 14px;
      background-color: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      cursor: pointer;
      z-index: 1000;
    }
    /* 撮影ボタンのスタイル */
    #snap-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      font-weight: bold;
    }
    #snap-btn:active {
      background-color: #ff1493;
    }
    /* 撮影した写真のプレビュー画面 */
    #preview {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 2000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      box-sizing: border-box;
    }
    #preview.show { display: flex; }
    #preview img {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #preview p {
      color: white;
      font-size: 13px;
      margin: 0;
      text-align: center;
    }
    #preview .btn-row { display: flex; gap: 12px; }
    #preview button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      color: white;
      background-color: #ff69b4;
    }
    #preview button.secondary { background-color: #666; }
  </style>
</head>
<body>

  <button id="mode-btn">1本指：移動</button>
  <button id="snap-btn">写真を撮る</button>

  <div id="preview">
    <img id="preview-img" alt="撮影した写真">
    <p id="preview-hint">「保存」を押すか、画像を長押しして保存してください</p>
    <div class="btn-row">
      <button id="save-btn">保存</button>
      <button id="close-btn" class="secondary">閉じる</button>
    </div>
  </div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" screenshot>
    <a-assets>
      <img id="halloween-ar-img" src="halloween-ar.png">
      <img id="rabbit-ar-img" src="rabbit-ar.png">
    </a-assets>

    <a-image id="rabbit-object" src="#rabbit-ar-img" position="-0.8 0 -4" width="1.2" height="1.798828125"></a-image>
    <a-image id="halloween-object" src="#halloween-ar-img" position="0.8 0 -4" width="1.4" height="1.4"></a-image>

    <a-entity camera></a-entity>
  </a-scene>

<script>
// ==========================================
// 1. 指操作（1本：移動または回転（ボタンで切替）/ 2本：拡大縮小＋移動 / 3本：移動）
// ==========================================
let arObject = null;
const arObjects = [
  document.getElementById('halloween-object'),
  document.getElementById('rabbit-object')
];
const sceneEl = document.querySelector('a-scene');
const raycaster = new AFRAME.THREE.Raycaster();
const touchPoint = new AFRAME.THREE.Vector2();
const imagePixels = new WeakMap();

// 透明な余白では選択しない。重なった画像も、見えている部分で選べる。
function isVisiblePixel(hit) {
  const material = hit.object.material;
  const image = material && material.map && material.map.image;
  if (!hit.uv || !image || !image.complete || !image.naturalWidth) return true;
  let pixels = imagePixels.get(image);
  if (!pixels) {
    try {
      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0);
      pixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
      imagePixels.set(image, pixels);
    } catch (error) {
      // ピクセルを読めない環境でも、画像の矩形で選択できるようにする。
      return true;
    }
  }
  const x = Math.max(0, Math.min(pixels.width - 1, Math.floor(hit.uv.x * pixels.width)));
  const v = material.map.flipY ? 1 - hit.uv.y : hit.uv.y;
  const y = Math.max(0, Math.min(pixels.height - 1, Math.floor(v * pixels.height)));
  return pixels.data[(y * pixels.width + x) * 4 + 3] > 16;
}

function pickObject(touch) {
  if (!touch || !sceneEl.camera || !sceneEl.canvas) return null;
  const rect = sceneEl.canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  touchPoint.set(
    ((touch.clientX - rect.left) / rect.width) * 2 - 1,
    -((touch.clientY - rect.top) / rect.height) * 2 + 1
  );
  sceneEl.object3D.updateMatrixWorld(true);
  sceneEl.camera.updateMatrixWorld(true);
  raycaster.setFromCamera(touchPoint, sceneEl.camera);
  const hits = raycaster.intersectObjects(arObjects.map(el => el.object3D), true);
  for (const hit of hits) {
    if (!isVisiblePixel(hit)) continue;
    for (let node = hit.object; node; node = node.parent) {
      const object = arObjects.find(el => el.object3D === node && node.visible);
      if (object) return object;
    }
  }
  return null;
}
const OBJECT_Z = -4;      // 画像を置く奥行き（position の3つ目の値と合わせる）
const ROTATE_SPEED = 0.5; // 1本指で動かした1pxあたりの回転角（度）

// 指を置いた時点の状態（指の本数が変わるたびに取り直す）
let gesture = null;

// 1本指の動作：'move'（移動）か 'rotate'（回転）。ボタンで切り替え
let oneFingerMode = 'move';
const modeBtn = document.getElementById('mode-btn');
modeBtn.addEventListener('click', function() {
  oneFingerMode = oneFingerMode === 'move' ? 'rotate' : 'move';
  modeBtn.textContent = oneFingerMode === 'move' ? '1本指：移動' : '1本指：回転';
  gesture = null;
});

// 画面上の1pxが、画像の位置（奥行き OBJECT_Z）で何単位に当たるかを計算
// → 指の動きと画像の動きがぴったり合う
function unitsPerPixel() {
  const cam = sceneEl.camera;
  const fov = cam ? cam.fov : 80;
  const visibleHeight = 2 * Math.abs(OBJECT_Z) * Math.tan((fov / 2) * Math.PI / 180);
  return visibleHeight / window.innerHeight;
}

function centroid(touches) {
  let x = 0, y = 0;
  for (const t of touches) { x += t.clientX; y += t.clientY; }
  return { x: x / touches.length, y: y / touches.length };
}

function distance(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

// 今の指の位置と画像の状態を「基準」として記録する
function startGesture(touches) {
  if (touches.length === 0) { gesture = null; arObject = null; return; }
  if (!arObject) return;
  const rot = arObject.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
  const pos = arObject.getAttribute('position') || { x: 0, y: 0, z: OBJECT_Z };
  const scl = arObject.getAttribute('scale') || { x: 1, y: 1, z: 1 };
  gesture = {
    object: arObject,
    count: touches.length,
    center: centroid(touches),
    dist: touches.length >= 2 ? distance(touches) : 0,
    rotX: rot.x, rotY: rot.y,
    posX: pos.x, posY: pos.y,
    scaleX: scl.x, scaleY: scl.y
  };
}

window.addEventListener('touchstart', function(e) {
  if (e.target.closest('button, #preview')) return;
  if (!gesture) {
    arObject = pickObject(e.changedTouches[0]);
    if (!arObject) return; // 背景を触っても画像は動かさない
  }
  e.preventDefault();
  startGesture(e.touches); // 指を増やしても最初に触れた画像を操作し続ける
}, { passive: false });

window.addEventListener('touchmove', function(e) {
  if (e.target.closest('button, #preview')) return;
  if (!gesture) return;
  e.preventDefault(); // ブラウザ標準のスクロールや拡大を止める
  if (!gesture || e.touches.length !== gesture.count) {
    startGesture(e.touches);
    return;
  }

  const c = centroid(e.touches);
  const dx = c.x - gesture.center.x;
  const dy = c.y - gesture.center.y;

  if (gesture.count === 1 && oneFingerMode === 'rotate') {
    // 1本指（回転モード）：左右の動きでY軸回転、上下の動きでX軸回転
    const newRotX = gesture.rotX + dy * ROTATE_SPEED;
    const newRotY = gesture.rotY + dx * ROTATE_SPEED;
    gesture.object.setAttribute('rotation', `${newRotX} ${newRotY} 0`);
    return;
  }

  // 1本指（移動モード）・2本・3本指：指の中心の動きに合わせて画像を移動（指とぴったり同じ量）
  const k = unitsPerPixel();
  const newX = gesture.posX + dx * k;
  const newY = gesture.posY - dy * k;
  gesture.object.setAttribute('position', `${newX} ${newY} ${OBJECT_Z}`);

  if (gesture.count === 2 && gesture.dist > 0) {
    // 2本指はさらに、指の間隔で拡大縮小
    const factor = distance(e.touches) / gesture.dist;
    const newScaleX = Math.max(0.2, Math.min(5.0, gesture.scaleX * factor));
    const newScaleY = Math.max(0.2, Math.min(5.0, gesture.scaleY * factor));
    gesture.object.setAttribute('scale', `${newScaleX} ${newScaleY} 1`);
  }
}, { passive: false });

window.addEventListener('touchend', function(e) {
  if (gesture) startGesture(e.touches); // 操作中の画像だけ、残った指で続ける
});
window.addEventListener('touchcancel', function() {
  arObject = null;
  gesture = null;
});

// ==========================================
// 2. 写真撮影（画面に映っているとおりに合成 → プレビュー → 保存）
// ==========================================
const previewEl = document.getElementById('preview');
const previewImg = document.getElementById('preview-img');
let capturedDataUrl = null;

// 画面上の要素の位置と大きさを、合成用キャンバスの座標に変換する
function rectOf(el, dpr) {
  const r = el.getBoundingClientRect();
  return { x: r.left * dpr, y: r.top * dpr, w: r.width * dpr, h: r.height * dpr };
}

document.getElementById('snap-btn').addEventListener('click', function() {
  const scene = document.querySelector('a-scene');
  const video = document.querySelector('video');
  if (!scene || !scene.canvas || !scene.renderer || !video || !video.videoWidth) {
    alert('AR機能の読み込み中です。数秒待ってからもう一度押してください。');
    return;
  }

  // 画面と同じ縦横比・端末の解像度で合成する
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const mergeCanvas = document.createElement('canvas');
  mergeCanvas.width = Math.round(window.innerWidth * dpr);
  mergeCanvas.height = Math.round(window.innerHeight * dpr);
  const ctx = mergeCanvas.getContext('2d');
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, mergeCanvas.width, mergeCanvas.height);

  // 1) カメラ映像を、画面に表示されている位置・大きさのまま描く
  const vr = rectOf(video, dpr);
  ctx.drawImage(video, vr.x, vr.y, vr.w, vr.h);

  // 2) AR画像を描き直してから、画面に表示されている位置・大きさのまま重ねる
  scene.renderer.render(scene.object3D, scene.camera);
  const cr = rectOf(scene.canvas, dpr);
  ctx.drawImage(scene.canvas, cr.x, cr.y, cr.w, cr.h);

  try {
    capturedDataUrl = mergeCanvas.toDataURL('image/png');
  } catch (e) {
    alert('写真を作成できませんでした。スマートフォンのスクリーンショット機能で撮影してください。');
    return;
  }
  previewImg.src = capturedDataUrl;
  previewEl.classList.add('show');
});

document.getElementById('close-btn').addEventListener('click', function() {
  previewEl.classList.remove('show');
});

// data URL → Blob（保存・共有用）
function dataUrlToBlob(dataUrl) {
  const [head, body] = dataUrl.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: mime });
}

document.getElementById('save-btn').addEventListener('click', async function() {
  if (!capturedDataUrl) return;
  const fileName = 'ar-photo_' + Date.now() + '.png';
  const blob = dataUrlToBlob(capturedDataUrl);
  const file = new File([blob], fileName, { type: 'image/png' });

  // iPhone / iPad / Android：共有シートを開き「画像を保存」で写真アプリに保存できる
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file] });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return; // ユーザーがキャンセルした
    }
  }

  // パソコンなど：ファイルとしてダウンロード
  try {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.download = fileName;
    link.href = url;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    alert('自動保存ができない環境です。画像を長押しして「写真に追加」を選んでください。');
  }
});
</script>
</body>
</html>
