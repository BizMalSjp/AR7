<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR4</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      touch-action: none; /* ブラウザ標準のスクロールや引っ張りリフレッシュを禁止 */
    }
    /* 1本指の動作切り替えボタン */
    #mode-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      padding: 8px 14px;
      font-size: 14px;
      background-color: rgba(0,0,0,0.5);
      color: white;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 20px;
      cursor: pointer;
      z-index: 1000;
    }
    /* 撮影ボタンのスタイル */
    #snap-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      font-size: 16px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      font-weight: bold;
    }
    #snap-btn:active {
      background-color: #ff1493;
    }
  </style>
</head>
<body>

  <button id="mode-btn">1本指：移動</button>
  <button id="snap-btn">写真を撮る</button>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" screenshot>
    <a-assets>
      <img id="halloween-ar-img" src="halloween-ar.png">
    </a-assets>

    <a-image id="ar-object" src="#halloween-ar-img" position="0 0 -4" width="2" height="2"></a-image>

    <a-entity camera></a-entity>
  </a-scene>

<script>
// ==========================================
// 1. 指操作（1本：移動または回転（ボタンで切替）/ 2本：拡大縮小＋移動 / 3本：移動）
// ==========================================
const arObject = document.getElementById('ar-object');
const sceneEl = document.querySelector('a-scene');
const OBJECT_Z = -4;      // 画像を置く奥行き（position の3つ目の値と合わせる）
const ROTATE_SPEED = 0.5; // 1本指で動かした1pxあたりの回転角（度）

// 指を置いた時点の状態（指の本数が変わるたびに取り直す）
let gesture = null;

// 1本指の動作：'move'（移動）か 'rotate'（回転）。ボタンで切り替え
let oneFingerMode = 'move';
const modeBtn = document.getElementById('mode-btn');
modeBtn.addEventListener('click', function() {
  oneFingerMode = oneFingerMode === 'move' ? 'rotate' : 'move';
  modeBtn.textContent = oneFingerMode === 'move' ? '1本指：移動' : '1本指：回転';
});

// 画面上の1pxが、画像の位置（奥行き OBJECT_Z）で何単位に当たるかを計算
// → 指の動きと画像の動きがぴったり合う
function unitsPerPixel() {
  const cam = sceneEl.camera;
  const fov = cam ? cam.fov : 80;
  const visibleHeight = 2 * Math.abs(OBJECT_Z) * Math.tan((fov / 2) * Math.PI / 180);
  return visibleHeight / window.innerHeight;
}

function centroid(touches) {
  let x = 0, y = 0;
  for (const t of touches) { x += t.clientX; y += t.clientY; }
  return { x: x / touches.length, y: y / touches.length };
}

function distance(touches) {
  return Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
}

// 今の指の位置と画像の状態を「基準」として記録する
function startGesture(touches) {
  if (touches.length === 0) { gesture = null; return; }
  const rot = arObject.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
  const pos = arObject.getAttribute('position') || { x: 0, y: 0, z: OBJECT_Z };
  const scl = arObject.getAttribute('scale') || { x: 1, y: 1, z: 1 };
  gesture = {
    count: touches.length,
    center: centroid(touches),
    dist: touches.length >= 2 ? distance(touches) : 0,
    rotX: rot.x, rotY: rot.y,
    posX: pos.x, posY: pos.y,
    scaleX: scl.x, scaleY: scl.y
  };
}

window.addEventListener('touchstart', function(e) {
  if (e.target.tagName === 'BUTTON') return; // ボタンはそのまま押せるようにする
  e.preventDefault();
  startGesture(e.touches); // 指が増えるたびに基準を取り直す
}, { passive: false });

window.addEventListener('touchmove', function(e) {
  e.preventDefault(); // ブラウザ標準のスクロールや拡大を止める
  if (!gesture || e.touches.length !== gesture.count) {
    startGesture(e.touches);
    return;
  }

  const c = centroid(e.touches);
  const dx = c.x - gesture.center.x;
  const dy = c.y - gesture.center.y;

  if (gesture.count === 1 && oneFingerMode === 'rotate') {
    // 1本指（回転モード）：左右の動きでY軸回転、上下の動きでX軸回転
    const newRotX = gesture.rotX + dy * ROTATE_SPEED;
    const newRotY = gesture.rotY + dx * ROTATE_SPEED;
    arObject.setAttribute('rotation', `${newRotX} ${newRotY} 0`);
    return;
  }

  // 1本指（移動モード）・2本・3本指：指の中心の動きに合わせて画像を移動（指とぴったり同じ量）
  const k = unitsPerPixel();
  const newX = gesture.posX + dx * k;
  const newY = gesture.posY - dy * k;
  arObject.setAttribute('position', `${newX} ${newY} ${OBJECT_Z}`);

  if (gesture.count === 2 && gesture.dist > 0) {
    // 2本指はさらに、指の間隔で拡大縮小
    const factor = distance(e.touches) / gesture.dist;
    const newScaleX = Math.max(0.2, Math.min(5.0, gesture.scaleX * factor));
    const newScaleY = Math.max(0.2, Math.min(5.0, gesture.scaleY * factor));
    arObject.setAttribute('scale', `${newScaleX} ${newScaleY} 1`);
  }
}, { passive: false });

window.addEventListener('touchend', function(e) {
  startGesture(e.touches); // 指が減っても、残った指の位置から続けられるようにする
});
window.addEventListener('touchcancel', function(e) {
  startGesture(e.touches);
});

// ==========================================
// 2. 写真撮影（キャプチャ）の処理
// ==========================================
document.getElementById('snap-btn').addEventListener('click', function() {
  const scene = document.querySelector('a-scene');
  if (!scene || !scene.components.screenshot) {
    alert('AR機能の読み込み中です。数秒待ってからもう一度押してください。');
    return;
  }
  const targetCanvas = scene.components.screenshot.getCanvas('perspective');
  const video = document.querySelector('video');
  if (!video) {
    alert('カメラ映像が取得できません。');
    return;
  }

  const mergeCanvas = document.createElement('canvas');
  const width = window.innerWidth;
  const height = window.innerHeight;
  mergeCanvas.width = width;
  mergeCanvas.height = height;
  const ctx = mergeCanvas.getContext('2d');

  const videoWidth = video.videoWidth || width;
  const videoHeight = video.videoHeight || height;
  const videoAspectRatio = videoWidth / videoHeight;
  const canvasAspectRatio = width / height;
  let drawWidth, drawHeight, drawX, drawY;

  if (videoAspectRatio > canvasAspectRatio) {
    drawHeight = height;
    drawWidth = drawHeight * videoAspectRatio;
    drawX = (width - drawWidth) / 2;
    drawY = 0;
  } else {
    drawWidth = width;
    drawHeight = drawWidth / videoAspectRatio;
    drawX = 0;
    drawY = (height - drawHeight) / 2;
  }

  ctx.drawImage(video, drawX, drawY, drawWidth, drawHeight);
  if (targetCanvas) {
    ctx.drawImage(targetCanvas, 0, 0, width, height);
  }

  try {
    const imgData = mergeCanvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = 'ar-photo_' + Date.now() + '.png';
    link.href = imgData;
    link.click();
  } catch (e) {
    try {
      const imgData = mergeCanvas.toDataURL('image/png');
      const newTab = window.open();
      newTab.document.body.innerHTML = `<img src="${imgData}" style="width:100%;">`;
    } catch(err) {
      alert('自動保存が制限されました。スマートフォンのスクリーンショット機能で撮影してください。');
    }
  }
});
</script>
</body>
</html>
